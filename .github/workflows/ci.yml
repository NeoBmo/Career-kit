# Flujo de integración continua: ejecuta tests, revisa privacidad y compila las hojas de vida.
name: CI

# Se dispara en cada push, pull request y ejecución manual.
on: [push, pull_request, workflow_dispatch]

# Permisos mínimos: sólo lectura del repositorio.
permissions:
  contents: read

jobs:
  # Job 1: ejecuta la suite de tests unitarios de Python.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ejecutar tests
        run: python3 -m unittest discover -s tests

  # Job 2: busca correos y teléfonos reales en los archivos versionados.
  # Sólo corre en el repositorio original; en las copias de la plantilla cada
  # persona guarda su propio CV y este chequeo no aplica.
  privacidad:
    name: Privacidad
    runs-on: ubuntu-latest
    if: github.repository == 'NeoBmo/Career-kit'
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Comprobar privacidad
        run: python3 -m scripts.privacy_check

  # Job 3: compila las hojas de vida de ejemplo y las deja como artefacto.
  hojas-de-vida:
    name: Hojas de vida
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Primero se compilan todas las personas de content/ (salvo private).
      - name: Compilar las hojas de vida
        run: |
          set -e
          for dir in content/*/; do
            [ -f "${dir}cv.json" ] || continue
            [ "$dir" = "content/private/" ] && continue
            bash scripts/build.sh "${dir%/}"
          done
      # Los PDF se suben siempre, aunque la comprobación ATS de después falle:
      # así puedes descargarlos y ver qué keyword falta.
      - name: Subir PDFs como artefacto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hojas-de-vida
          path: builds/*/out/*.pdf
          retention-days: 30
      - name: Comprobar que un ATS puede leerlas
        run: |
          set -e
          for dir in content/*/; do
            [ -f "${dir}cv.json" ] || continue
            [ "$dir" = "content/private/" ] && continue
            python3 -m scripts.check_all "${dir%/}"
          done